name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # npm trusted publishing (OIDC); no NPM_TOKEN, nothing to expire

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'  # trusted publishing needs npm >= 11.5.1 / Node >= 22.14
          registry-url: 'https://registry.npmjs.org'

      # Pin the floor explicitly: the npm bundled with a given Node 24.x may lag.
      # 11.15.0 is the first with `npm stage publish`.
      - name: Ensure npm supports staged trusted publishing
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Staged, not live: a maintainer approves with 2FA on npmjs.com
      # (Staged Packages tab) or `npm stage approve <id>` before users get it.
      # The trusted publisher on npmjs.com only allows staging.
      - name: Stage on npm
        run: npm stage publish

      - name: Prune devDependencies before packing
        run: npm prune --production

      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb

      - name: Pack .mcpb bundle
        run: mcpb pack

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.mcpb'
          generate_release_notes: true
