# service.yml — Service manifest for this repository.
#
# Purpose: Machine-readable descriptor of what this service does, where it runs,
#   who owns it, and what it depends on.
# Infrastructure repo: This file is consumed by the central inventory at
#   https://github.com/Humbl-Solutions-OU/infrastructure which aggregates all
#   service manifests into a single map of the org's running systems.
#
# Update this file when servers change, status changes, or ownership changes.

name: humbl-mcp-server
description: MCP server for AI assistants — lets Claude, Cursor, and Cline query humbl.ai intelligence data in plain English
status: active
owner: ekinertac

stack:
  - node
  - typescript
  - mcp

depends_on:
  - humbl.ai (data source API)

servers:
  - name: humbl-mcp
    provider: hetzner
    role: remote MCP server (Streamable HTTP) at https://mcp.humbl.ai

notes: |
  Two entry points from one codebase: the npm package / .mcpb bundle run on each
  user's machine over stdio; the same code runs as a remote HTTP server on the
  Hetzner box for claude.ai web, mobile and connector directories. Both are
  stateless proxies to the humbl.ai API; the only credential is the user's key.
